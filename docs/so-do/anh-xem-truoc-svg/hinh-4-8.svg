25;"/><!--link ReviewService to ReviewDto--><path d="M385.625,638.0781 C462.0938,676.6094 602.4375,742.7813 729.6875,778.4375 C847.625,811.4844 990.9375,826.4531 1068.5156,832.5469 " fill="none" id="ReviewService-ReviewDto" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1076.1875,833.1406,1062.649,825.8246,1068.3983,832.538,1061.6848,838.2873,1076.1875,833.1406" style="stroke: #383838; stroke-width: 1.5625;"/><!--link ReviewService to DeleteReviewResponse--><path d="M358.8281,637.875 C422.2188,697.3281 574.6406,830.4531 729.6875,892.5 C824.3594,930.3906 940.6719,943.8281 1022.5469,948.4063 " fill="none" id="ReviewService-DeleteReviewResponse" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1030,948.7969,1016.2781,941.8308,1022.1979,948.3945,1015.6342,954.3143,1030,948.7969" style="stroke: #383838; stroke-width: 1.5625;"/><!--link CreateReviewRequestValidator to CreateReviewRequest--><path d="M449.1562,1064.375 C607.9063,1064.375 883.3125,1064.375 1028.7031,1064.375 " fill="none" id="CreateReviewRequestValidator-CreateReviewRequest" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1036.1563,1064.375,1022.0938,1058.125,1028.3438,1064.375,1022.0938,1070.625,1036.1563,1064.375" style="stroke: #383838; stroke-width: 1.5625;"/><!--link ReviewService to IAppDbContext--><path d="M359.5,578.375 C423.5156,519.5156 576.125,388.3125 729.6875,323.75 C828.5469,282.1875 951.25,264.625 1033.5,257.2188 " fill="none" id="ReviewService-IAppDbContext" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1040.9688,256.5781,1026.4214,251.559,1033.1851,257.2491,1027.495,264.0128,1040.9688,256.5781" style="stroke: #383838; stroke-width: 1.5625;"/><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Times New Roman"
skinparam classAttributeIconSize 0
skinparam dpi 150
skinparam nodesep 35
skinparam ranksep 55
left to right direction
hide circle
hide empty members
class MoviesController <<Controller>> {
  +GetCanReviewStatus(movieId : int) : ActionResult<CanReviewResponse>
  +CreateReview(movieId : int, request : CreateReviewRequest) : IActionResult
  +UpdateReview(movieId : int, id : int, request : CreateReviewRequest) : IActionResult
  +DeleteReview(movieId : int, id : int) : IActionResult
}
interface IReviewService {
  +GetUserMovieReviewStatusAsync(userId : int, movieId : int) : CanReviewResponse
  +CreateReviewAsync(userId : int, movieId : int, request : CreateReviewRequest) : ReviewDto
  +UpdateReviewAsync(userId : int, movieId : int, reviewId : int, request : CreateReviewRequest) : ReviewDto
  +DeleteMyReviewAsync(userId : int, movieId : int, reviewId : int) : DeleteReviewResponse
}
class ReviewService <<Service>>
class CreateReviewRequestValidator <<Validator>>
interface IAppDbContext {
  +DbSet
  +SaveChangesAsync
}
class Review <<Entity>>
class Movie <<Entity>>
class BookingTicket <<Entity>>
class CanReviewResponse <<DTO>>
class CreateReviewRequest <<DTO>>
class ReviewDto <<DTO>>
class DeleteReviewResponse <<DTO>>
MoviesController ..> IReviewService
ReviewService ..|> IReviewService
ReviewService ..> Review
ReviewService ..> Movie
ReviewService ..> BookingTicket
ReviewService ..> CanReviewResponse
ReviewService ..> CreateReviewRequest
ReviewService ..> ReviewDto
ReviewService ..> DeleteReviewResponse
CreateReviewRequestValidator ..> CreateReviewRequest
ReviewService ..> IAppDbContext
@enduml

