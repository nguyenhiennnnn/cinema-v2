bo--><path d="M601.3594,574.75 C813.1719,596.5156 1358.2031,652.5156 1554.2188,672.6563 " fill="none" id="BookingQueryService-BookingCombo" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1561.5,673.3906,1548.1553,665.7268,1553.729,672.5867,1546.869,678.1604,1561.5,673.3906" style="stroke: #383838; stroke-width: 1.5625;"/><!--link BookingQueryService to Payment--><path d="M601.3125,595.7344 C714.9688,634.0938 922.4844,700.0781 1104.6875,736.25 C1277.4844,770.5625 1486.8438,786.0313 1578.7188,791.5469 " fill="none" id="BookingQueryService-Payment" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1586.4531,792,1572.7914,784.9166,1578.6547,791.5308,1572.0406,797.3941,1586.4531,792" style="stroke: #383838; stroke-width: 1.5625;"/><!--link BookingQueryService to AdminBookingListItemDto--><path d="M563.0313,595.7969 C660.2969,655.4531 891.3281,788.9375 1104.6875,850.3125 C1239.9063,889.2188 1401.8281,902.2187 1508.9063,906.4063 " fill="none" id="BookingQueryService-AdminBookingListItemDto" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1516.0781,906.6875,1502.2573,899.9198,1508.271,906.3975,1501.7933,912.4112,1516.0781,906.6875" style="stroke: #383838; stroke-width: 1.5625;"/><!--link BookingQueryService to AdminBookingDetailDto--><path d="M546.9375,595.5469 C630.0156,672.0625 866,876.5469 1104.6875,964.375 C1241.0938,1014.5625 1410.0781,1024.6406 1517.9219,1025.1094 " fill="none" id="BookingQueryService-AdminBookingDetailDto" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1525.1406,1025.125,1511.096,1018.8348,1517.3282,1025.1027,1511.0603,1031.3348,1525.1406,1025.125" style="stroke: #383838; stroke-width: 1.5625;"/><!--link BookingQueryService to IAppDbContext--><path d="M601.4688,536.875 C715.2813,499.3281 922.9688,434.2187 1104.6875,395.625 C1253.5313,364.0156 1429.375,343.1094 1534.0156,332.3594 " fill="none" id="BookingQueryService-IAppDbContext" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1541.5625,331.5938,1526.9452,326.7824,1533.7892,332.3755,1528.196,339.2196,1541.5625,331.5938" style="stroke: #383838; stroke-width: 1.5625;"/><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Times New Roman"
skinparam classAttributeIconSize 0
skinparam dpi 150
skinparam nodesep 35
skinparam ranksep 55
left to right direction
hide circle
hide empty members

class AdminBookingsController <<Controller>> {
  +GetBookings(filter : AdminBookingListFilter, page : int, pageSize : int) : ActionResult<OffsetPageResult<AdminBookingListItemDto>>
  +GetBookingDetail(bookingId : int) : ActionResult<AdminBookingDetailDto>
}

interface IBookingQueryService {
  +GetBookingsAdminAsync(filter : AdminBookingListFilter, page : int, pageSize : int) : Task<OffsetPageResult<AdminBookingListItemDto>>
  +GetBookingDetailAdminAsync(bookingId : int) : Task<AdminBookingDetailDto>
}

class BookingQueryService <<Service>>
class AdminBookingListFilter <<record>>

interface IAppDbContext {
  +DbSet
  +SaveChangesAsync
}

class Booking <<Entity>>
class BookingTicket <<Entity>>
class BookingCombo <<Entity>>
class Payment <<Entity>>

class AdminBookingListItemDto <<DTO>>
class AdminBookingDetailDto <<DTO>>

AdminBookingsController ..> IBookingQueryService
BookingQueryService ..|> IBookingQueryService

BookingQueryService ..> AdminBookingListFilter
BookingQueryService ..> Booking
BookingQueryService ..> BookingTicket
BookingQueryService ..> BookingCombo
BookingQueryService ..> Payment
BookingQueryService ..> AdminBookingListItemDto
BookingQueryService ..> AdminBookingDetailDto

BookingQueryService ..> IAppDbContext
@enduml

