es New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="400" x="1021.0938" y="941.7389">thêm Payment (Pending, Amount=FinalAmount,</text><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="123.4375" x="1021.0938" y="965.0963">TransactionId)</text><polygon fill="#383838" points="558.5938,1011.5974,542.9688,1017.8474,558.5938,1024.0974,552.3438,1017.8474" style="stroke: #383838; stroke-width: 1.5625;"/><line style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 2.0,2.0;" x1="549.2188" x2="980.4688" y1="1017.8474" y2="1017.8474"/><text fill="#000000" font-family="Times New Roman" font-size="20.3125" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="21.875" x="567.9688" y="1010.3287">14</text><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="375" x="596.0938" y="1010.3287">CheckoutResponse (PaymentUrl, PaymentId)</text><polygon fill="#383838" points="110.1563,1056.8298,94.5313,1063.0798,110.1563,1069.3298,103.9063,1063.0798" style="stroke: #383838; stroke-width: 1.5625;"/><line style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 2.0,2.0;" x1="100.7813" x2="539.8438" y1="1063.0798" y2="1063.0798"/><text fill="#000000" font-family="Times New Roman" font-size="20.3125" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="21.875" x="119.5313" y="1055.5611">15</text><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="250" x="147.6563" y="1055.5611">chuyển hướng tới PaymentUrl</text><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Times New Roman"
skinparam sequenceMessageAlign left
skinparam maxMessageSize 300
skinparam ParticipantPadding 12
skinparam dpi 150
autonumber

actor "Khách hàng" as K
participant "BookingsController" as C
participant "BookingCheckoutService" as S
participant "IAppDbContext" as DB
participant "IPaymentGateway (VNPay, MoMo, Stripe)" as G

K -> C : POST /api/v1/bookings/{bookingId}/checkout (PaymentMethod)
C -> S : CheckoutAsync(userId, bookingId, request)
S -> DB : tìm Booking
alt không thấy
S - -> K : 404 NotFound_Booking
else không phải chủ đơn
S - -> K : 403 Forbidden_NotBookingOwner
else không Pending hoặc đã quá ExpiresAt
S - -> K : 422 Rule_BookingNotPendingOrExpired
end
S -> S : FindByMethod(MethodName)
alt chưa cấu hình cổng
S - -> K : Rule_PaymentGatewayNotConfigured
end
S -> DB : các Payment Pending cũ của đơn → Failed
S -> S : GeneratePaymentTransactionId(bookingCode)
S -> G : CreatePaymentAsync(BookingId, FinalAmount, mô tả, TransactionId)
G - -> S : PaymentUrl
S -> DB : thêm Payment (Pending, Amount=FinalAmount, TransactionId)
S - -> C : CheckoutResponse (PaymentUrl, PaymentId)
C - -> K : chuyển hướng tới PaymentUrl
@enduml

