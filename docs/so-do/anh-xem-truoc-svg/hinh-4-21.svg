25 1125.4688,795.3594 " fill="none" id="PaymentAdminService-AdminPaymentDetailDto" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1133.1094,795.5,1119.1747,788.9701,1125.2984,795.3438,1118.9247,801.4676,1133.1094,795.5" style="stroke: #383838; stroke-width: 1.5625;"/><!--link AdminPaymentDetailDto to AdminPaymentBookingBriefDto--><path d="M1339.375,794.0625 C1458.4063,794.0625 1657.5,794.0625 1790.9688,794.0625 " fill="none" id="AdminPaymentDetailDto-AdminPaymentBookingBriefDto" style="stroke: #383838; stroke-width: 1.5625;"/><polygon fill="#383838" points="1798.5,794.0625,1784.4375,787.8125,1790.6875,794.0625,1784.4375,800.3125,1798.5,794.0625" style="stroke: #383838; stroke-width: 1.5625;"/><!--link PaymentAdminService to IAppDbContext--><path d="M432.6719,439 C603.0938,414.5469 971.9687,361.625 1144.0469,336.9375 " fill="none" id="PaymentAdminService-IAppDbContext" style="stroke: #383838; stroke-width: 1.5625; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="1151.7656,335.8281,1136.9538,331.6536,1144.0334,336.9455,1138.7416,344.0251,1151.7656,335.8281" style="stroke: #383838; stroke-width: 1.5625;"/><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Times New Roman"
skinparam classAttributeIconSize 0
skinparam dpi 150
skinparam nodesep 35
skinparam ranksep 55
left to right direction
hide circle
hide empty members
class AdminPaymentsController <<Controller>> {
  +GetPayments(filter : AdminPaymentListFilter, page : int, pageSize : int) : IActionResult
  +GetDetail(id : int) : IActionResult
}
interface IPaymentAdminService {
  +GetPaymentsAsync(filter : AdminPaymentListFilter, page : int, pageSize : int) : OffsetPageResult<AdminPaymentListItemDto>
  +GetPaymentDetailAsync(paymentId : int) : AdminPaymentDetailDto
}
class PaymentAdminService <<Service>>
class AdminPaymentListFilter <<record>>
interface IAppDbContext {
  +DbSet
  +SaveChangesAsync
}
class Payment <<Entity>>
class Booking <<Entity>>
class AdminPaymentListItemDto <<DTO>>
class AdminPaymentDetailDto <<DTO>>
class AdminPaymentBookingBriefDto <<DTO>>
AdminPaymentsController ..> IPaymentAdminService
PaymentAdminService ..|> IPaymentAdminService
PaymentAdminService ..> AdminPaymentListFilter
PaymentAdminService ..> Payment
PaymentAdminService ..> Booking
PaymentAdminService ..> AdminPaymentListItemDto
PaymentAdminService ..> AdminPaymentDetailDto
AdminPaymentDetailDto - -> AdminPaymentBookingBriefDto
PaymentAdminService ..> IAppDbContext
@enduml

