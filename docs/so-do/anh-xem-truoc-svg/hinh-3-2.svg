rả lời hoặc</text><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="135.9375" x="1018.75" y="992.5085">yêu cầu gọi hàm</text><!--link SYS to MAIL--><path d="M718.2344,772.5156 C750.4688,851.4219 822.4063,996.7969 935.9375,1064.25 C1055.4531,1135.2656 1220.3281,1137.3281 1326.1719,1129.0938 " fill="none" id="SYS-MAIL" style="stroke: #000000; stroke-width: 1.5625;"/><polygon fill="#000000" points="1333.875,1128.4688,1319.3432,1123.4047,1326.0893,1129.1157,1320.3784,1135.8618,1333.875,1128.4688" style="stroke: #000000; stroke-width: 1.5625;"/><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="214.0625" x="979.6875" y="1059.7761">IEmailService.SendAsync</text><!--link SYS to CLD--><path d="M710.7188,772.4688 C735.6406,868.25 801.5156,1068.5 935.9375,1170.5 C996.2813,1216.2813 1199.8438,1248.6094 1326.2188,1264.8281 " fill="none" id="SYS-CLD" style="stroke: #000000; stroke-width: 1.5625;"/><polygon fill="#000000" points="1333.5938,1265.7656,1320.4292,1257.7963,1325.8433,1264.7829,1318.8567,1270.197,1333.5938,1265.7656" style="stroke: #000000; stroke-width: 1.5625;"/><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="125" x="1024.2188" y="1166.0261">tệp ảnh / video</text><!--link CLD to SYS--><path d="M1335.9844,1309.0781 C1229.3594,1339.25 1055.2656,1368.8281 935.9375,1289.25 C762.7813,1173.7813 715.6719,905.6875 703.0156,782.6875 " fill="none" id="CLD-SYS" style="stroke: #000000; stroke-width: 1.5625;"/><polygon fill="#000000" points="702.25,775.0156,697.397,789.6192,703.0097,782.7911,709.8378,788.4037,702.25,775.0156" style="stroke: #000000; stroke-width: 1.5625;"/><text fill="#000000" font-family="Times New Roman" font-size="20.3125" lengthAdjust="spacingAndGlyphs" textLength="115.625" x="1028.9063" y="1284.7761">URL, PublicId</text><!--
@startuml
skinparam defaultFontName "Times New Roman"
skinparam shadowing false
skinparam dpi 150
left to right direction
skinparam rectangleBackgroundColor White
skinparam rectangleBorderColor Black
skinparam actorBackgroundColor White
skinparam actorBorderColor Black
skinparam ArrowColor Black
skinparam maxMessageSize 200

actor "Khách vãng lai" as KVL
actor "Khách hàng" as KH
actor "Nhân viên /\nQuản trị viên" as NV

rectangle "Hệ thống Perfo\n(React SPA + Cinema.Api + Application\n+ Infrastructure + PostgreSQL)" as SYS

rectangle "Cổng VNPay / MoMo / Stripe" <<Hệ thống ngoài>> as PAY
rectangle "Google" <<Hệ thống ngoài>> as GG
rectangle "Gemini" <<Hệ thống ngoài>> as GEM
rectangle "Dịch vụ email\n(Resend / SMTP)" <<Hệ thống ngoài>> as MAIL
rectangle "Cloudinary" <<Hệ thống ngoài>> as CLD

KVL - -> SYS : HTTP /api/v1/...\n(xem dữ liệu công khai, xác thực)
KH - -> SYS : giữ ghế, thanh toán, hủy đơn, đánh giá;\nSignalR /hubs/showtimes
NV - -> SYS : HTTP /api/v1/admin/...\n(quản trị, bán vé tại quầy, soát vé)
SYS - -> KVL : JSON
SYS - -> KH : JSON; sự kiện seat.held, seat.released,\nseat.booked, hold.expired
SYS - -> NV : JSON

SYS - -> PAY : yêu cầu tạo liên kết thanh toán,\nyêu cầu hoàn tiền
PAY - -> SYS : IPN / webhook\n/api/v1/payments/...
SYS - -> GG : ID token
GG - -> SYS : GoogleUserInfo
SYS - -> GEM : lịch sử hội thoại, system prompt,\nkhai báo hàm
GEM - -> SYS : câu trả lời hoặc\nyêu cầu gọi hàm
SYS - -> MAIL : IEmailService.SendAsync
SYS - -> CLD : tệp ảnh / video
CLD - -> SYS : URL, PublicId
@enduml

