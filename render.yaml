databases:
  - name: cinema-db
    plan: free
    region: singapore
    databaseName: cinema_db
    user: cinema_user
    ipAllowList: []

services:
  - type: web
    name: cinema-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: cinema-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RunMigrationsOnStartup
        value: "true"
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: Cinema
      - key: Jwt__Audience
        value: Cinema.Client
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: App__ApiBaseUrl
        sync: false
      - key: App__FrontendBaseUrl
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Email__ResendApiKey
        sync: false
      - key: Email__ResendFromAddress
        value: onboarding@resend.dev
      - key: Email__FromName
        value: Cinema
      - key: VnPay__TmnCode
        sync: false
      - key: VnPay__HashSecret
        sync: false
      - key: VnPay__ReturnUrl
        sync: false
      - key: VnPay__IpnUrl
        sync: false
      - key: Momo__PartnerCode
        sync: false
      - key: Momo__AccessKey
        sync: false
      - key: Momo__SecretKey
        sync: false
      - key: Momo__ReturnUrl
        sync: false
      - key: Momo__IpnUrl
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__PublishableKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Stripe__ReturnUrl
        sync: false
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: Gemini__ApiKey
        sync: false

  - type: web
    name: cinema-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_SITE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
