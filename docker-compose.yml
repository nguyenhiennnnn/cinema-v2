name: cinema

# Môi trường PHÁT TRIỂN: hot-reload cho BE (dotnet watch) và FE (Vite HMR).
# Database: Neon PostgreSQL Cloud (không dùng postgres local nữa).
# Copy .env.example thành .env trước khi chạy: `docker compose up --build -d`

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: perfo-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      RunMigrationsOnStartup: ${RUN_MIGRATIONS_ON_STARTUP:-true}

      # Neon PostgreSQL Cloud — pooler connection
      ConnectionStrings__DefaultConnection: ${DATABASE_URL}

      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      App__ApiBaseUrl: ${API_BASE_URL:-http://localhost:8080}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}

      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      Jwt__Issuer: ${JWT_ISSUER:-Perfo}
      Jwt__Audience: ${JWT_AUDIENCE:-Perfo.Client}
      Jwt__AccessTokenExpirationSeconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      Jwt__SocketTokenExpirationSeconds: ${JWT_SOCKET_TOKEN_EXPIRATION_SECONDS:-300}

      Brand__Name: ${BRAND_NAME:-Perfo}
      Brand__DisplayName: ${BRAND_DISPLAY_NAME:-PERFO}
      Brand__Tagline: ${BRAND_TAGLINE:-Vé điện tử · Không cần in}
      Brand__SupportEmail: ${BRAND_SUPPORT_EMAIL:-}

      Booking__CheckInOpenMinutes: ${BOOKING_CHECK_IN_OPEN_MINUTES:-30}
      RateLimit__GlobalSegmentsPerWindow: ${RATE_LIMIT_GLOBAL_SEGMENTS_PER_WINDOW:-4}

      Scheduler__StepMinutes: ${SCHEDULER_STEP_MINUTES:-5}
      Scheduler__MinSameMovieGapMinutes: ${SCHEDULER_MIN_SAME_MOVIE_GAP_MINUTES:-60}
      Scheduler__DefaultWindowMinutes: ${SCHEDULER_DEFAULT_WINDOW_MINUTES:-960}
      Scheduler__SpreadMinutes: ${SCHEDULER_SPREAD_MINUTES:-30}
      Scheduler__FitWeight: ${SCHEDULER_FIT_WEIGHT:-4}
      Scheduler__LoadWeight: ${SCHEDULER_LOAD_WEIGHT:-0.5}
      Scheduler__HeatLookbackDays: ${SCHEDULER_HEAT_LOOKBACK_DAYS:-7}

      BackgroundJobs__ReleaseExpiredSeatsCron: "${BG_RELEASE_EXPIRED_SEATS_CRON:-* * * * *}"
      BackgroundJobs__ShowtimeLifecycleCron: "${BG_SHOWTIME_LIFECYCLE_CRON:-* * * * *}"
      BackgroundJobs__RetryAttempts: ${BG_RETRY_ATTEMPTS:-3}

      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}

      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@perfo.local}
      Email__FromName: ${SMTP_FROM_NAME:-}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__ResendFromAddress: ${RESEND_FROM_ADDRESS:-onboarding@resend.dev}

      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:5173/booking/result}
      VnPay__IpnUrl: ${VNPAY_IPN_URL:-http://localhost:8080/api/v1/payments/vnpay/ipn}
      VnPay__ApiUrl: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

      Momo__PartnerCode: ${MOMO_PARTNER_CODE:-}
      Momo__AccessKey: ${MOMO_ACCESS_KEY:-}
      Momo__SecretKey: ${MOMO_SECRET_KEY:-}
      Momo__Endpoint: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      Momo__ReturnUrl: ${MOMO_RETURN_URL:-http://localhost:5173/booking/result}
      Momo__IpnUrl: ${MOMO_IPN_URL:-http://localhost:8080/api/v1/payments/momo/ipn}
      Momo__RefundEndpoint: ${MOMO_REFUND_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/refund}

      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__ReturnUrl: ${STRIPE_RETURN_URL:-http://localhost:5173/booking/result}
      Stripe__Currency: ${STRIPE_CURRENCY:-vnd}

      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-2.5-flash}

      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./backend:/src
      - /src/Cinema.Api/bin
      - /src/Cinema.Api/obj
      - /src/Cinema.Application/bin
      - /src/Cinema.Application/obj
      - /src/Cinema.Domain/bin
      - /src/Cinema.Domain/obj
      - /src/Cinema.Infrastructure/bin
      - /src/Cinema.Infrastructure/obj
      - /src/Cinema.Shared/bin
      - /src/Cinema.Shared/obj
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/api/v1/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - perfo-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: perfo-frontend
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      VITE_SIGNALR_HUB_URL: ${VITE_SIGNALR_HUB_URL:-http://localhost:8080/hubs/showtimes}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules
    restart: unless-stopped
    networks:
      - perfo-net

networks:
  perfo-net:
    driver: bridge
