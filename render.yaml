# render.yaml — Render Infrastructure-as-Code
# Tham khảo: https://render.com/docs/blueprint-spec
#
# Để triển khai:
# 1. Tạo tài khoản Render.com
# 2. Kết nối repository GitHub
# 3. Tạo "New Blueprint" và chọn file này
# 4. Render sẽ tự động tạo PostgreSQL database và Web Service

services:
  # ── Backend: ASP.NET Core Web API ─────────────────────────────────────────
  - type: web
    name: cinema-api
    runtime: docker
    # Dockerfile nằm trong thư mục backend/
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Build target: production stage (không phải dev stage)
    dockerCommand: ""
    plan: free
    healthCheckPath: /health

    envVars:
      # ── Kết nối PostgreSQL — Render tự inject khi dùng fromDatabase ───────
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: cinema-db
          property: connectionString

      # ── ASP.NET Core Environment ──────────────────────────────────────────
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: RunMigrationsOnStartup
        value: "true"

      # ── CORS: cho phép domain frontend Vercel ────────────────────────────
      # Cập nhật giá trị này sau khi deploy frontend lên Vercel
      - key: Cors__AllowedOrigins__0
        sync: false   # Cần nhập thủ công trên Render Dashboard

      # ── App URL (URL của backend sau khi deploy) ─────────────────────────
      - key: App__ApiBaseUrl
        sync: false   # Cần nhập thủ công

      # ── JWT ──────────────────────────────────────────────────────────────
      - key: Jwt__Secret
        generateValue: true   # Render tự sinh secret ngẫu nhiên

      # ── Cloudinary ───────────────────────────────────────────────────────
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false

      # ── Email (SMTP) ──────────────────────────────────────────────────────
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__SmtpUser
        sync: false
      - key: Email__SmtpPassword
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: Cinema

      # ── VnPay ─────────────────────────────────────────────────────────────
      - key: VnPay__TmnCode
        sync: false
      - key: VnPay__HashSecret
        sync: false
      - key: VnPay__ReturnUrl
        sync: false   # https://<frontend-vercel-domain>/booking/result
      - key: VnPay__IpnUrl
        sync: false   # https://<cinema-api-render-domain>/api/v1/payments/vnpay/ipn

      # ── Momo ──────────────────────────────────────────────────────────────
      - key: Momo__PartnerCode
        sync: false
      - key: Momo__AccessKey
        sync: false
      - key: Momo__SecretKey
        sync: false
      - key: Momo__ReturnUrl
        sync: false
      - key: Momo__IpnUrl
        sync: false

      # ── Stripe ────────────────────────────────────────────────────────────
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__PublishableKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Stripe__ReturnUrl
        sync: false

      # ── Google OAuth ──────────────────────────────────────────────────────
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false

      # ── Gemini AI ─────────────────────────────────────────────────────────
      - key: Gemini__ApiKey
        sync: false

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: cinema-db
    plan: free
    databaseName: cinema_db
    user: cinema_user
    region: singapore   # Chọn region gần nhất với user của bạn
